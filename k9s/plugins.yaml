plugins:
  # Leverage stern (https://github.com/stern/stern) to output logs.
  stern:
    shortCut: Ctrl-Y
    confirm: false
    description: "Logs <Stern>"
    scopes:
      - pods
    command: bash
    background: false
    args:
      - -c
      - |
        # 從 deployment 鑽入 pods 時，k9s 會把 label selector（如 app=foo）塞進 $FILTER，
        # 含 = 時改用 stern -l，否則照舊當 pod 名稱 regex。
        Q='$FILTER'
        if [[ "$Q" == *=* ]]; then
          set -- -l "$Q"
        else
          set -- "$Q"
        fi

        stern \
          --tail 2000 \
          --exclude 'GET / HTTP' \
          --exclude 'GET /v1/licenses/current' \
          --exclude 'OPTIONS /v1/licenses/current' \
          "$@" \
          -n "$NAMESPACE" \
          --context "$CONTEXT"

  # Leverage stern + jq to output pretty-printed JSON logs.
  stern-jq:
    shortCut: Ctrl-U
    confirm: false
    description: "Logs <Stern+jq>"
    scopes:
      - pods
    command: bash
    background: false
    args:
      - -c
      - |
        # 從 deployment 鑽入 pods 時，k9s 會把 label selector（如 app=foo）塞進 $FILTER，
        # 含 = 時改用 stern -l，否則照舊當 pod 名稱 regex。
        Q='$FILTER'
        if [[ "$Q" == *=* ]]; then
          set -- -l "$Q"
        else
          set -- "$Q"
        fi

        stern \
          --tail 5000 \
          --exclude 'GET / HTTP' \
          --exclude 'GET /v1/licenses/current' \
          --exclude 'OPTIONS /v1/licenses/current' \
          --output json \
          "$@" \
          -n "$NAMESPACE" \
          --context "$CONTEXT" |

        jq -Rr '

          def ansi($n; $s):
            "\u001b[\($n)m\($s)\u001b[0m";

          def pod_color($pname):
            [31,32,33,34,35,36,91,92,93,94,95,96] as $colors
            | $colors[
                ($pname | explode | add)
                % ($colors | length)
              ];

          def level_color($lvl):
            if $lvl == "ERROR" then 31
            elif $lvl == "WARNING" then 33
            else 32
            end;

          try fromjson catch . as $line |

          (
            if ($line | type) == "object"
            then
              ($line.message // "") as $raw
              | (try ($raw | fromjson) catch { raw:$raw })
            else
              { raw:$line }
            end
          ) as $msg |

          ($line.podName // "-") as $pod |
          ($msg.asctime // "-") as $ts |
          ($msg.levelname // "-") as $lvl |
          ($msg.exc_info // $msg.message // $msg.raw // "-") as $text |

          (ansi(pod_color($pod); $pod) + " " + $ts + " " + ansi(level_color($lvl); $lvl) + " " + $text)
        '

  kube-metrics:
    shortCut: m
    confirm: false
    description: "Metrics"
    scopes:
      - pods
    command: kubectl
    background: false
    args:
      - top
      - pod
      - $NAME
      - --namespace=$NAMESPACE
      - --context=$CONTEXT
      - --containers

  node-metrics:
    shortCut: m
    confirm: false
    description: "Metrics"
    scopes:
      - nodes
    command: kubectl
    background: false
    args:
      - top
      - node
      - $NAME
      - --context=$CONTEXT
